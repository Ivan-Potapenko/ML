behaviors:
  Hider:
    trainer_type: poca
    max_steps: 100000000

    hyperparameters:
      batch_size: 4096
      buffer_size: 200000
      learning_rate: 1.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      strength: 0.1
      demo_path: Demos/HiderDemonstrati.demo

  Seeker:
    trainer_type: poca
    max_steps: 100000000

    hyperparameters:
      batch_size: 4096
      buffer_size: 200000
      learning_rate: 1.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    behavioral_cloning:
      strength: 0.1
      demo_path: Demos/SeekerDemonstrat_15.demo