behaviors:
  Hider:
    trainer_type: poca              # MA‑POCA для групповых наград
    max_steps: 100000000

    hyperparameters:
      batch_size: 4096             # POCA обычно требует больших batch
      buffer_size: 200000
      learning_rate: 1.0e-4
      beta: 0.01                  # POCA‑специфичный параметр
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      strength: 0.1
      demo_path: Demos/HiderDemonstrati.demo

    # Опционально: параметры self-play внутри POCA
    # self_play:
    #   team_change: 50000         # шаг, после которого меняется оппонент
    #   save_steps: 50000          # шаг, через который сохраняется версия
    #   swap_steps: 25000          # шаг, через который грузится прошлый оппонент

  Seeker:
    trainer_type: poca
    max_steps: 150000000

    hyperparameters:
      batch_size: 4096
      buffer_size: 200000
      learning_rate: 1.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    behavioral_cloning:
      strength: 0.1
      demo_path: Demos/SeekerDemonstrat_15.demo

    # GAIL и Behavioral Cloning в MA‑POCA могут не поддерживаться напрямую,
    # поэтому их лучше убрать или адаптировать:
    #reward_signals:
    #  gail:
    #    strength: 0.8
    #    demo_path: Demos/SeekerDemonstrat_0.demo
    #behavioral_cloning:
    #  strength: 0.8
    #  demo_path: Demos/SeekerDemonstrat_0.demo